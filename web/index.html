<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudNest</title>
    <!-- Branding: CloudNest's own cloud mark (no third-party favicon). The .ico
         covers older browsers; the SVG is crisp at any size on modern ones. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563EB" />
    <!-- FE-10: theme bootstrap runs before the stylesheet applies (no flash on
         reload). External same-origin file: script-src 'self' CSP blocks inline. -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
